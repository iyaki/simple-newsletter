name: auto-merge dependencies

on:
  pull_request:
    branches:
      - main

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # fastify/github-action-merge-dependabot v3.15.0, pinned to its commit SHA
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f
        with:
          target: minor
          # github-token: ${{ secrets.AUTOMERGE_DEPENDENCIES }}
