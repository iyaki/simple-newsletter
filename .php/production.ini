zend.exception_ignore_args = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.assertions = -1
disable_functions = "var_dump,exec,system,passthru"


; OPcache is statically compiled into the frankenphp binary (no opcache.so on disk),
; so zend_extension=opcache.so fails to load with a startup warning. Only the
; opcache.* runtime settings are needed here.
opcache.enable=1
opcache.enable_cli=1
opcache.interned_strings_buffer=16
opcache.validate_timestamps=0
opcache.save_comments=0

; Esto podría traer problemas
opcache.jit=On
opcache.jit_buffer_size=100M

; Specifies a PHP script that is going to be compiled and executed at server
; start-up.
; https://php.net/opcache.preload
; TODO: Configurar preloading
;opcache.preload=
