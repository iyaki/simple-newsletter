# E2E against the production image.
# Uses the Nix OCI production image (infrastructure/image.nix, built from the
# devenv.lock pin), previously loaded/tagged as simple-newsletter:e2e by
# scripts/run-e2e-against-prod.sh, exposing the app on host port 8082. The
# host-runner bind-mounts the entire ./data directory so the e2e suite and the
# in-container app share the same SQLite file (and its WAL/SHM sidecars).
# `host.docker.internal` is mapped to the host gateway so the in-container app
# can reach the feed and SMTP servers that the runner spins up on the host.
#
# A directory bind mount (not a single-file bind mount) is required so writes
# from the host's pest process and from the container's FrankenPHP worker stay
# visible to both sides; SQLite's WAL/SHM live alongside the DB file.
services:
  prod:
    image: simple-newsletter:e2e
    ports:
      # el contenedor bindea 8082 (no root en podman rootless local no puede
      # bindear :80); en CI rootful da igual
      - "8082:8082"
    environment:
      NEWSLETTER_DB_PATH: /app/data/test-e2e.db
      SECRET_KEY: test-e2e-secret-key-32chars!
      SERVER_NAME: ":8082"
      URI_SELF: http://localhost:8082
      SMTP_HOST: host.docker.internal
      SMTP_PORT: "1025"
      SMTP_ENCRYPTION: ""
      SMTP_USER: test
      SMTP_PASSWORD: test
      EMAIL_FROM: noreply@example.com
      EMAIL_REPLY_TO: dev@example.com
      SENTRY_DSN: ""
      # The e2e feed server runs on the host behind host.docker.internal (a
      # private address); lift the feed egress policy for this fixture only.
      NEWSLETTER_ALLOW_PRIVATE_FEEDS: "1"
    extra_hosts:
      - "host.docker.internal:${HOST_IP:-host-gateway}"
    volumes:
      - ./data:/app/data
